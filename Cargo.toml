[package]
name = "omni_stt"
version = "4.1.1"
edition = "2024"
repository = "https://github.com/eoftgge/soniox_live"
rust-version = "1.96.0"

[dependencies]
thiserror = "2.0.18"
tungstenite = { version = "0.30.0", features = ["native-tls"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3.34"
eframe = { version = "0.36.1", features = ["glow", "default_fonts"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
tracing-appender = "0.2.5"
toml = "1.1.4"
egui-toast = "0.22.0"
cpal = "0.18.2"
bytemuck = "1.25.2"
embed_plist = "1.2.2"
async-trait = "0.1.92"
tokio-util = "0.7.19"
rfd = "0.17.2"
vosk = { version = "0.3.1", optional = true }

[build-dependencies]
winres = "0.1.12"
image = "0.25.10"

[features]
default = []
vosk = ["dep:vosk"]

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
