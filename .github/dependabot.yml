# Weekly PRs for Rust dependencies. CI builds and tests each one on Linux and
# Windows, so a green PR is safe to merge.
#
# GitHub Actions are left out on purpose: release.yml is generated by
# cargo-dist and checked against what dist would generate, so a hand bump
# there breaks the release. `dist init` updates it on a dist upgrade.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # egui-toast is built against one egui version, so the two move together.
      gui:
        patterns:
          - "eframe"
          - "egui*"
      # tokio-tungstenite wraps tungstenite types, so the two move together.
      websocket:
        patterns:
          - "tungstenite"
          - "tokio-tungstenite"
      # Compatible fixes in one PR instead of one per crate.
      patch:
        update-types:
          - "patch"
