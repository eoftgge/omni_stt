name: rust.yml

on:
  push:
    paths:
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "Info.plist"
      - ".github/workflows/**"
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Check & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            pkg-config \
            libudev-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxdo-dev

      # The release bump has to touch Info.plist by hand, and the macOS build
      # embeds whatever version it holds.
      - name: Info.plist matches Cargo.toml
        if: runner.os == 'Linux'
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)
          if [ "$(grep -c "<string>$version</string>" Info.plist)" -ne 2 ]; then
            echo "::error file=Info.plist::Version is not $version, as in Cargo.toml"
            exit 1
          fi

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
